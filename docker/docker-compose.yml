services:
  #############
  # PLEX APPS #
  #############

  bazarr:
    image: 'lscr.io/linuxserver/bazarr:latest'
    container_name: 'bazarr'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "6767:6767"
    volumes:
      - '${DATA_DIR}/bazarr/config:/config'
    networks:
      - traefik-proxy

  lidarr:
    image: 'lscr.io/linuxserver/lidarr:latest'
    container_name: 'lidarr'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8686:8686"
    volumes:
      - '${DATA_DIR}/lidarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${PLEX_DIR}/Music:/music'
    networks:
      - traefik-proxy

  nzbget:
    image: 'linuxserver/nzbget:latest'
    container_name: 'nzbget'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "6789:6789"
    volumes:
      - '${DATA_DIR}/nzbget/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${DATA_DIR}/nzbget/intermediate:/data/intermediate'
    networks:
      - traefik-proxy

  ombi:
    image: 'lscr.io/linuxserver/ombi:latest'
    container_name: 'ombi'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "3579:3579"
    volumes:
      - '${DATA_DIR}/ombi/config:/config'
    networks:
      - traefik-proxy

  overseerr:
    image: 'lscr.io/linuxserver/overseerr:latest'
    container_name: 'overseer'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "5055:5055"
    volumes:
      - '${DATA_DIR}/overseerr/config:/config'
    networks:
      - traefik-proxy

  prowlarr:
    image: 'lscr.io/linuxserver/prowlarr:latest'
    container_name: 'prowlarr'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "9696:9696"
    volumes:
      - '${DATA_DIR}/prowlarr/config:/config'
    networks:
      - traefik-proxy

  radarr:
    image: 'lscr.io/linuxserver/radarr:latest'
    container_name: 'radarr'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "7878:7878"
    volumes:
      - '${ARR_DATA_DIR:-${DATA_DIR}}/radarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${PLEX_DIR}/Movies:/movies'
    networks:
      - traefik-proxy

  sonarr:
    image: 'lscr.io/linuxserver/sonarr:latest'
    container_name: 'sonarr'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8989:8989"
    volumes:
      - '${ARR_DATA_DIR:-${DATA_DIR}}/sonarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${PLEX_DIR}/TV Shows:/tv'
    networks:
      - traefik-proxy

  tautulli:
    image: 'lscr.io/linuxserver/tautulli:latest'
    container_name: 'tautulli'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8181:8181"
    volumes:
      - '${DATA_DIR}/tautulli/config:/config'
    networks:
      - traefik-proxy

  ###########
  # AI APPS #
  ###########

  # ollama:
  #   image: 'ollama/ollama:latest'
  #   container_name: 'ollama'
  #   restart: unless-stopped
  #   environment:
  #     TZ: '${TZ}'
  #   volumes:
  #     - '${DATA_DIR}/ollama/data:/root/.ollama'
  #   networks:
  #     - traefik-proxy

  # open-webui:
  #   image: 'ghcr.io/open-webui/open-webui:latest'
  #   container_name: 'open-webui'
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_BASE_URL: 'http://ollama:11434'
  #     # WEBUI_SECRET_KEY: '${WEBUI_SECRET_KEY}'
  #     TZ: '${TZ}'
  #   ports:
  #     - "8082:8080"
  #   volumes:
  #     - '${DATA_DIR}/open-webui/data:/app/backend/data'
  #   networks:
  #     - traefik-proxy

  ###################
  # DASHBOARD APPS #
  ###################

  heimdall:
    image: 'lscr.io/linuxserver/heimdall:latest'
    container_name: 'heimdall'
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
      APP_URL: 'https://heimdall.${DOMAIN}'
    ports:
      - "8282:80"
    volumes:
      - '${DATA_DIR}/heimdall/config:/config'
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # organizr:
  #   image: 'organizr/organizr:latest'
  #   container_name: 'organizr'
  #   restart: unless-stopped
  #   environment:
  #     PGID: '${PGID}'
  #     PUID: '${PUID}'
  #     TZ: '${TZ}'
  #   ports:
  #     - "8888:80"
  #   volumes:
  #     - '${DATA_DIR}/organizr/config:/config'
  #   networks:
  #     - traefik-proxy

  ################
  # DATABASE APPS #
  ################

  postgres:
    image: postgres:16
    container_name: 'postgres'
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TZ: '${TZ}'
    ports:
      - "5432:5432"
    volumes:
      - '${DB_DATA_DIR:-${DATA_DIR}}/postgres/data:/var/lib/postgresql/data'
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: 'adminer'
    restart: unless-stopped
    environment:
      TZ: '${TZ}'
    ports:
      - "8090:8080"
    networks:
      - traefik-proxy

  mysql:
    # Version 8.4.0 is the latest version that I was able to get Ombi to work with - 2025-07-04
    image: mysql:8.4.0
    container_name: 'mysql'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      # MYSQL_DATABASE: '${MYSQL_DATABASE}'
      # MYSQL_USER: '${MYSQL_USER}'
      # MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      TZ: '${TZ}'
    ports: 
      - "3306:3306"
    volumes:
      - '${DB_DATA_DIR:-${DATA_DIR}}/mysql/data:/var/lib/mysql'
    networks:
      - traefik-proxy
    # command: >
    #   --innodb-buffer-pool-size=512M
    #   --innodb-flush-log-at-trx-commit=2
    #   --innodb-lock-wait-timeout=60
    #   --lock-wait-timeout=60
    #   --max-connections=200
    #   --wait-timeout=300
    #   --interactive-timeout=300
    #   --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64
    container_name: 'phpmyadmin'
    restart: unless-stopped
    environment:
      TZ: '${TZ}'
      PMA_HOST: 'mysql'
      # PMA_PORT: '3306'
      # PMA_USER: 'root'
      # PMA_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      # PMA_ARBITRARY: '1'
    ports:
      - "8083:80"
    # volumes:
    #   - '${DATA_DIR}/phpmyadmin/data/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php'
    networks:
      - traefik-proxy

  ###########
  # UTILITIES #
  ###########

  portainer:
    image: portainer/portainer-ce:latest
    container_name: 'portainer'
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - '${DATA_DIR}/portainer/data:/data'
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3

  portainer-agent:
    image: portainer/agent:latest
    container_name: 'portainer-agent'
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik-proxy

  # bookstack:
  #   image: linuxserver/bookstack:latest
  #   container_name: 'bookstack'
  #   restart: unless-stopped
  #   environment:
  #     TZ: '${TZ}'
  #     PGID: '${PGID}'
  #     PUID: '${PUID}'
  #     DB_HOST: '${BOOKSTACK_DB_HOST}'
  #     DB_DATABASE: '${BOOKSTACK_DB_DATABASE}'
  #     DB_USERNAME: '${BOOKSTACK_DB_USERNAME}'
  #     DB_PASSWORD: '${BOOKSTACK_DB_PASSWORD}'
  #     DB_PORT: '${BOOKSTACK_DB_PORT}'
  #     APP_URL: 'https://bookstack.${DOMAIN}'
  #     APP_KEY: '${BOOKSTACK_APP_KEY}'
  #   ports:
  #     - "8085:80"
  #   volumes:
  #     - '${DATA_DIR}/bookstack/config:/config'
  #   networks:
  #     - traefik-proxy

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: 'uptime-kuma'
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - '${DATA_DIR}/uptime-kuma:/app/data'
    networks:
      - traefik-proxy

  it-tools:
    image: corentinth/it-tools:latest
    container_name: 'it-tools'
    restart: unless-stopped
    environment:
      TZ: '${TZ}'
    ports:
      - "8084:80"
    volumes:
      - '${DATA_DIR}/it-tools/data:/app/data'
    networks:
      - traefik-proxy


  n8n:
    image: n8nio/n8n:latest
    container_name: 'n8n'
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - '${DATA_DIR}/n8n/data:/home/node/.n8n'
    networks:
      - traefik-proxy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: '${N8N_DB_HOST:-}'
      DB_POSTGRESDB_PORT: '${N8N_DB_PORT:-}'
      DB_POSTGRESDB_DATABASE: '${N8N_DB_DATABASE:-}'
      DB_POSTGRESDB_USER: '${N8N_DB_USER:-}'
      DB_POSTGRESDB_PASSWORD: '${N8N_DB_PASSWORD:-}'
      DB_POSTGRESDB_SCHEMA: '${N8N_DB_SCHEMA:-}'

  ###########
  # MONITORING #
  ###########

