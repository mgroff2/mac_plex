# Cap container logs so they can't grow without bound (applied to every service)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  #############
  # PLEX APPS #
  #############

  bazarr:
    image: 'lscr.io/linuxserver/bazarr:latest'
    container_name: 'bazarr'
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
      # PostgreSQL instead of SQLite: SQLite's shared-memory locking is not
      # reliable on Docker Desktop's macOS file sharing and corrupts under load.
      # Off unless BAZARR_DB_ENABLED=true (see .env.example).
      POSTGRES_ENABLED: '${BAZARR_DB_ENABLED:-false}'
      POSTGRES_HOST: 'postgres'
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: '${BAZARR_DB_NAME:-bazarr}'
      POSTGRES_USERNAME: '${BAZARR_DB_USER:-bazarr}'
      POSTGRES_PASSWORD: '${BAZARR_DB_PASSWORD:-}'
    ports:
      - "6767:6767"
    volumes:
      - '${DATA_DIR}/bazarr/config:/config'
      # Same container paths as Sonarr (/tv) and Radarr (/movies), so the paths
      # they report match what Bazarr sees and no path mappings are needed
      - '${TV_DIR:-${PLEX_DIR}/TV Shows}:/tv'
      - '${PLEX_DIR}/Movies:/movies'
    networks:
      - traefik-proxy

  lidarr:
    image: 'lscr.io/linuxserver/lidarr:latest'
    container_name: 'lidarr'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8686:8686"
    volumes:
      - '${DATA_DIR}/lidarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${PLEX_DIR}/Music:/music'
    networks:
      - traefik-proxy

  nzbget:
    image: 'linuxserver/nzbget:latest'
    container_name: 'nzbget'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "6789:6789"
    volumes:
      - '${DATA_DIR}/nzbget/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${DATA_DIR}/nzbget/intermediate:/data/intermediate'
    networks:
      - traefik-proxy

  ombi:
    image: 'lscr.io/linuxserver/ombi:latest'
    container_name: 'ombi'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "3579:3579"
    volumes:
      - '${DATA_DIR}/ombi/config:/config'
    networks:
      - traefik-proxy

  prowlarr:
    image: 'lscr.io/linuxserver/prowlarr:latest'
    container_name: 'prowlarr'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "9696:9696"
    volumes:
      - '${DATA_DIR}/prowlarr/config:/config'
    networks:
      - traefik-proxy

  radarr:
    image: 'lscr.io/linuxserver/radarr:latest'
    container_name: 'radarr'
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "7878:7878"
    volumes:
      - '${ARR_DATA_DIR:-${DATA_DIR}}/radarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${PLEX_DIR}/Movies:/movies'
    networks:
      - traefik-proxy

  sonarr:
    image: 'lscr.io/linuxserver/sonarr:latest'
    container_name: 'sonarr'
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8989:8989"
    volumes:
      - '${ARR_DATA_DIR:-${DATA_DIR}}/sonarr/config:/config'
      - '${DATA_DIR}/nzbget/downloads:/data/downloads'
      - '${TV_DIR:-${PLEX_DIR}/TV Shows}:/tv'
    networks:
      - traefik-proxy

  tautulli:
    image: 'lscr.io/linuxserver/tautulli:latest'
    container_name: 'tautulli'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
    ports:
      - "8181:8181"
    volumes:
      - '${DATA_DIR}/tautulli/config:/config'
    networks:
      - traefik-proxy

  ###################
  # DASHBOARD APPS #
  ###################

  heimdall:
    image: 'lscr.io/linuxserver/heimdall:latest'
    container_name: 'heimdall'
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGID: '${PGID}'
      PUID: '${PUID}'
      TZ: '${TZ}'
      APP_URL: 'https://heimdall.${DOMAIN}'
    ports:
      - "8282:80"
    volumes:
      - '${DATA_DIR}/heimdall/config:/config'
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  ################
  # DATABASE APPS #
  ################

  postgres:
    image: postgres:16
    container_name: 'postgres'
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TZ: '${TZ}'
    ports:
      - "5432:5432"
    volumes:
      - '${DB_DATA_DIR:-${DATA_DIR}}/postgres/data:/var/lib/postgresql/data'
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: 'adminer'
    logging: *default-logging
    restart: unless-stopped
    environment:
      TZ: '${TZ}'
    ports:
      - "8090:8080"
    networks:
      - traefik-proxy

  mysql:
    # Version 8.4.0 is the latest version that I was able to get Ombi to work with - 2025-07-04
    image: mysql:8.4.0
    container_name: 'mysql'
    logging: *default-logging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      # MYSQL_DATABASE: '${MYSQL_DATABASE}'
      # MYSQL_USER: '${MYSQL_USER}'
      # MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
      TZ: '${TZ}'
    ports: 
      - "3306:3306"
    volumes:
      - '${DB_DATA_DIR:-${DATA_DIR}}/mysql/data:/var/lib/mysql'
    networks:
      - traefik-proxy
    # command: >
    #   --innodb-buffer-pool-size=512M
    #   --innodb-flush-log-at-trx-commit=2
    #   --innodb-lock-wait-timeout=60
    #   --lock-wait-timeout=60
    #   --max-connections=200
    #   --wait-timeout=300
    #   --interactive-timeout=300
    #   --lower-case-table-names=1
    healthcheck:
      # No credentials needed: mysqladmin ping exits 0 whenever the server is up,
      # and keeping the password out of the command keeps it out of docker inspect/events
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  ###########
  # UTILITIES #
  ###########

  portainer:
    image: portainer/portainer-ce:latest
    container_name: 'portainer'
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - '${DATA_DIR}/portainer/data:/data'
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik-proxy
    # No healthcheck: the portainer-ce image has no shell, curl or wget to run one

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: 'uptime-kuma'
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - '${DATA_DIR}/uptime-kuma:/app/data'
    networks:
      - traefik-proxy

  it-tools:
    image: corentinth/it-tools:latest
    container_name: 'it-tools'
    logging: *default-logging
    restart: unless-stopped
    environment:
      TZ: '${TZ}'
    ports:
      - "8084:80"
    volumes:
      - '${DATA_DIR}/it-tools/data:/app/data'
    networks:
      - traefik-proxy

  n8n:
    image: n8nio/n8n:latest
    container_name: 'n8n'
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    volumes:
      - '${DATA_DIR}/n8n/data:/home/node/.n8n'
    networks:
      - traefik-proxy
    environment:
      TZ: '${TZ}'
      GENERIC_TIMEZONE: '${TZ}'
      # Public URL behind Traefik, so webhooks and login redirects use the real hostname
      N8N_HOST: 'n8n.${DOMAIN}'
      N8N_PROTOCOL: https
      WEBHOOK_URL: 'https://n8n.${DOMAIN}/'
      N8N_PROXY_HOPS: 1
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: '${N8N_DB_HOST:-}'
      DB_POSTGRESDB_PORT: '${N8N_DB_PORT:-}'
      DB_POSTGRESDB_DATABASE: '${N8N_DB_DATABASE:-}'
      DB_POSTGRESDB_USER: '${N8N_DB_USER:-}'
      DB_POSTGRESDB_PASSWORD: '${N8N_DB_PASSWORD:-}'
      DB_POSTGRESDB_SCHEMA: '${N8N_DB_SCHEMA:-}'

  ###########
  # MONITORING #
  ###########

  # Beszel hub: dashboard and alerts. The agent runs natively on the Mac
  # (Homebrew), because a container only sees Docker's Linux VM, not the host
  # or its drives. The agent connects to the hub on localhost:8091.
  beszel:
    image: henrygd/beszel:latest
    container_name: 'beszel'
    logging: *default-logging
    restart: unless-stopped
    environment:
      APP_URL: 'https://beszel.${DOMAIN}'
    ports:
      - "8091:8090"
    volumes:
      - '${DATA_DIR}/beszel/data:/beszel_data'
    networks:
      - traefik-proxy

  # Dozzle: live log viewer for all containers. Login is required (users and
  # settings live in /data), on top of Traefik's IP allowlist. Note that a
  # read-only socket mount does not limit what the Docker API allows.
  dozzle:
    image: amir20/dozzle:latest
    container_name: 'dozzle'
    logging: *default-logging
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
      # Require login even if /data is lost (fails closed instead of open).
      # Actions and shell stay disabled (Dozzle's default).
      DOZZLE_AUTH_PROVIDER: 'simple'
    ports:
      - "8092:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - '${DATA_DIR}/dozzle/data:/data'
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    name: traefik-proxy
    driver: bridge

